apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "image-optimize-proxy.fullname" . }}
  labels:
    {{- include "image-optimize-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "image-optimize-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "image-optimize-proxy.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "image-optimize-proxy.serviceAccountName" . }}
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "image-optimize-proxy.fullname" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: imgproxy
          image: "{{ .Values.imgproxy.image.repository }}:{{ .Values.imgproxy.image.tag }}"
          imagePullPolicy: {{ .Values.imgproxy.image.pullPolicy }}
          ports:
            - name: imgproxy
              containerPort: 8081
              protocol: TCP
          env:
            - name: IMGPROXY_BIND
              value: ":8081"
          resources:
            {{- toYaml .Values.imgproxy.resources | nindent 12 }}
