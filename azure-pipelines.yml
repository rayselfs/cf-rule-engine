trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - package.json
      - tsconfig.json
      - tsup.config.ts

pool:
  name: DevOps

variables:
  NODE_VERSION: '20'

stages:
  - stage: CI
    displayName: Build & Test
    jobs:
      - job: Build
        displayName: Build, Typecheck & Test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: Install Node.js

          - script: npm ci
            displayName: Install dependencies

          - script: npm run typecheck
            displayName: TypeScript typecheck

          - script: npm test
            displayName: Run tests

  - stage: Publish
    displayName: Publish to Verdaccio
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Publish
        displayName: npm publish
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: Install Node.js

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build package

          - script: |
              PACKAGE_NAME=$(node -p "require('./package.json').name")
              LOCAL_VERSION=$(node -p "require('./package.json').version")
              REMOTE_VERSION=$(npm view "${PACKAGE_NAME}" version 2>/dev/null || echo "0.0.0")
              if [ "${LOCAL_VERSION}" = "${REMOTE_VERSION}" ]; then
                echo "##[warning]Version ${LOCAL_VERSION} already published. Skipping."
                echo "##vso[task.setvariable variable=skipPublish]true"
              else
                echo "Publishing ${PACKAGE_NAME}@${LOCAL_VERSION} (registry has ${REMOTE_VERSION})"
                echo "##vso[task.setvariable variable=skipPublish]false"
              fi
            displayName: Check if version already published

          - script: |
              NPM_AUTH=$(echo -n "$(NPM_USER):$(NPM_PASS)" | base64)
              echo "//vr-ops-internal-npm-registry.vrprod.viveport.com/:_auth=${NPM_AUTH}" >> .npmrc
              echo "//vr-ops-internal-npm-registry.vrprod.viveport.com/:always-auth=true" >> .npmrc
              npm publish
            displayName: Publish to Verdaccio
            condition: ne(variables['skipPublish'], 'true')
            env:
              NPM_USER: $(NPM_USER)
              NPM_PASS: $(NPM_PASS)
