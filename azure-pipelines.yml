trigger:
  branches:
    include:
      - main

pool:
  name: DevOps

variables:
  NODE_VERSION: '20'

stages:
  - stage: CI
    displayName: Build & Test
    jobs:
      - job: Build
        displayName: Build, Typecheck & Test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: Install Node.js

          - script: npm ci
            displayName: Install dependencies

          - script: npm run typecheck
            displayName: TypeScript typecheck

          - script: npm test
            displayName: Run tests

  - stage: Publish
    displayName: Publish to Verdaccio
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Publish
        displayName: npm publish
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: Install Node.js

          - script: npm ci
            displayName: Install dependencies

          - script: npm run build
            displayName: Build package

          - script: |
              NPM_AUTH=$(echo -n "$(NPM_USER):$(NPM_PASS)" | base64)
              echo "//vr-ops-internal-npm-registry.vrprod.viveport.com/:_auth=${NPM_AUTH}" >> .npmrc
              echo "//vr-ops-internal-npm-registry.vrprod.viveport.com/:always-auth=true" >> .npmrc
              npm publish
            displayName: Publish to Verdaccio
            env:
              NPM_USER: $(NPM_USER)
              NPM_PASS: $(NPM_PASS)
