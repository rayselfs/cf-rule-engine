trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - '*'

pool:
  name: DevOps

variables:
  NODE_VERSION: '20'

stages:
  - stage: CI
    displayName: Build & Test
    jobs:
      - job: Build
        displayName: Build, Typecheck & Test
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
            displayName: Install Node.js

          - script: npm ci
            displayName: Install dependencies

          - script: npm run typecheck
            displayName: TypeScript typecheck

          - script: npm test
            displayName: Run tests

          - script: npm run build
            displayName: Build package

          - script: |
              echo "//vr-ops-internal-npm-registry.vrprod.viveport.com/:_authToken=$(NPM_TOKEN)" >> .npmrc
              npm publish --registry https://vr-ops-internal-npm-registry.vrprod.viveport.com
            displayName: Publish to Verdaccio
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              NPM_TOKEN: $(NPM_TOKEN)
